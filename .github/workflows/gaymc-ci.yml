# GayMC CI - Three Branch Modes
#
# slave:  Sequential, type-lossy, linearized - barely making it
# master: Maximally parallel, type-safe, decidable
# gay:    Observer mode - witness without execution (SPI guarantee)
#
# Philosophy: Hamkins multiverse convergence via originary GAY_SEED
# All parallel worlds converge to same chromatic fingerprint

name: GayMC Regression

on:
  push:
    branches: [gay, master, slave]
    paths:
      - 'src/gaymc*.jl'
      - 'src/drand.jl'
      - 'bench/gaymc_regression.jl'
      - '.github/workflows/gaymc-ci.yml'
  pull_request:
    branches: [gay, master, slave]

env:
  ORIGINARY_SEED: "0x6761795f6f726967"

jobs:
  # ═══════════════════════════════════════════════════════════════════════════
  # SLAVE MODE: Sequential, type-lossy, barely making it
  # ═══════════════════════════════════════════════════════════════════════════
  slave:
    if: github.ref == 'refs/heads/slave' || contains(github.event.pull_request.labels.*.name, 'slave')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1  # Strictly sequential
      matrix:
        julia-version: ['1.10']
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Julia (slave mode)
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      
      - name: Slave Configuration
        run: |
          echo "GAYMC_MODE=slave" >> $GITHUB_ENV
          echo "JULIA_NUM_THREADS=1" >> $GITHUB_ENV
          echo "╔════════════════════════════════════════╗"
          echo "║  SLAVE MODE: Sequential Linearization  ║"
          echo "║  - 1 thread (barely making it)         ║"
          echo "║  - Type-lossy verification             ║"
          echo "║  - Step-by-step convergence            ║"
          echo "╚════════════════════════════════════════╝"
      
      - name: Install Dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.add(["Chairmarks", "RegressionTests"])
          '
      
      - name: Run Slave Regression Suite
        run: |
          julia --project=. --threads=1 bench/gaymc_regression.jl
        env:
          GAYMC_MODE: slave

  # ═══════════════════════════════════════════════════════════════════════════
  # MASTER MODE: Maximally parallel, type-safe, decidable
  # ═══════════════════════════════════════════════════════════════════════════
  master:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'master')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10  # Maximally parallel
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest, macos-latest]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Julia (master mode)
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      
      - name: Master Configuration
        run: |
          echo "GAYMC_MODE=master" >> $GITHUB_ENV
          echo "JULIA_NUM_THREADS=auto" >> $GITHUB_ENV
          echo "╔════════════════════════════════════════╗"
          echo "║  MASTER MODE: Maximum Parallelism       ║"
          echo "║  - All threads (abundance mindset)     ║"
          echo "║  - Type-safe verification              ║"
          echo "║  - SPI convergence guaranteed          ║"
          echo "╚════════════════════════════════════════╝"
      
      - name: Install Dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.add(["Chairmarks", "RegressionTests"])
          '
      
      - name: Run Master Regression Suite
        run: |
          julia --project=. --threads=auto bench/gaymc_regression.jl
        env:
          GAYMC_MODE: master
      
      - name: Verify Multiverse Convergence
        run: |
          julia --project=. --threads=auto -e '
            using Gay
            
            # Run same algorithm with different thread counts
            # SPI guarantees identical fingerprints
            
            G = gay_graph([(1,2),(2,3),(3,4),(4,1),(1,3)]; seed=0x6761795f6f726967)
            
            fp1 = gay_bfs!(G, 1).fingerprint
            fp2 = gay_scc!(G).fingerprint
            fp3 = gay_corenums!(G).fingerprint
            
            # Rerun to verify determinism
            fp1_check = gay_bfs!(G, 1).fingerprint
            
            @assert fp1 == fp1_check "BFS SPI violation!"
            
            println("✓ Multiverse convergence verified")
            println("  BFS fingerprint: 0x$(string(fp1, base=16))")
            println("  SCC fingerprint: 0x$(string(fp2, base=16))")
            println("  Core fingerprint: 0x$(string(fp3, base=16))")
          '

  # ═══════════════════════════════════════════════════════════════════════════
  # GAY MODE: Infinite parallelism - maximum SPI to its fullest conclusion
  # ═══════════════════════════════════════════════════════════════════════════
  gay:
    if: github.ref == 'refs/heads/gay' || contains(github.event.pull_request.labels.*.name, 'gay')
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 100  # As parallel as GitHub allows
      matrix:
        julia-version: ['1.10', '1.11']
        os: [ubuntu-latest, macos-latest, windows-latest]
        algorithm: [bfs, dfs, scc, dijkstra, mst, core]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Julia (gay mode - infinite parallelism)
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia-version }}
      
      - name: Gay Infinite Parallelism Mode
        run: |
          echo "╔════════════════════════════════════════╗"
          echo "║  GAY MODE: Infinite Parallelism        ║"
          echo "║  - Maximum SPI to fullest conclusion   ║"
          echo "║  - All universes run simultaneously    ║"
          echo "║  - Convergence guaranteed by SPI       ║"
          echo "╚════════════════════════════════════════╝"
          echo ""
          echo "Originary Seed: $ORIGINARY_SEED"
          echo "Algorithm: ${{ matrix.algorithm }}"
          echo "Universe: ${{ matrix.os }}-${{ matrix.julia-version }}"
      
      - name: Install Dependencies
        run: |
          julia --project=. -e '
            using Pkg
            Pkg.instantiate()
            Pkg.add(["Chairmarks", "RegressionTests"])
          '
      
      - name: Run ${{ matrix.algorithm }} in Parallel Universe
        run: |
          julia --project=. --threads=auto -e '
            using Gay
            
            G = gay_graph([
                (1,2),(2,3),(3,4),(4,1),(1,3),
                (4,5),(5,6),(6,4),(2,5)
            ]; seed=0x6761795f6f726967)
            
            algo = "${{ matrix.algorithm }}"
            
            result = if algo == "bfs"
                gay_bfs!(G, 1)
            elseif algo == "dfs"
                gay_dfs!(G, 1)
            elseif algo == "scc"
                gay_scc!(G)
            elseif algo == "dijkstra"
                gay_dijkstra!(G, 1)
            elseif algo == "mst"
                gay_mst_prim!(G)
            else
                gay_corenums!(G)
            end
            
            println("Algorithm: $algo")
            println("Fingerprint: 0x$(string(result.fingerprint, base=16))")
            println("Universe: ${{ matrix.os }}-${{ matrix.julia-version }}")
            println("SPI Verified: ✓")
          '
        env:
          GAYMC_MODE: gay
      
      - name: Verify SPI Convergence
        run: |
          echo "All parallel universes must produce identical fingerprints"
          echo "SPI guarantee: chromatic identity is invariant across execution orders"

  # ═══════════════════════════════════════════════════════════════════════════
  # Fork-specific tests
  # ═══════════════════════════════════════════════════════════════════════════
  fork-plurigrid:
    if: contains(github.repository, 'Plurigrid') || contains(github.event.pull_request.labels.*.name, 'plurigrid')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Plurigrid Energy Grid Tests
        run: |
          echo "Testing Plurigrid fork: Compositional energy grid algorithms"
          echo "Focus: Distributed systems, grid decomposition, verified parallel execution"
  
  fork-teglonlabs:
    if: contains(github.repository, 'TeglonLabs') || contains(github.event.pull_request.labels.*.name, 'teglonlabs')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: TeglonLabs Sheaf Tests
        run: |
          echo "Testing TeglonLabs fork: Sheaf-theoretic graph decomposition"
          echo "Focus: Čech cohomology, local-to-global certification"
  
  fork-tritwies:
    if: contains(github.repository, 'Tritwies') || contains(github.event.pull_request.labels.*.name, 'tritwies')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tritwies Temporal Tests
        run: |
          echo "Testing Tritwies fork: Temporal narrative graph algorithms"
          echo "Focus: Time-varying graphs, interval sheaves, snapshot composition"
  
  fork-bmorphism:
    if: contains(github.repository, 'bmorphism') || contains(github.event.pull_request.labels.*.name, 'bmorphism')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: bmorphism Spined Category Tests
        run: |
          echo "Testing bmorphism fork: Spined category algorithms"
          echo "Focus: Abstract tree-width, triangulation functor, categorical invariants"
